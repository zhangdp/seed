server:
  port: 8080
  shutdown: graceful
  tomcat:
    max-connections: 20000
  # 禁止session
  servlet:
    session:
      tracking-modes: []
spring:
  profiles:
    active: dev
  application:
    name: @artifactId@
  threads:
    virtual:
      enabled: true
  servlet:
    multipart:
      enabled: true
      max-file-size: 256MB
      max-request-size: 256MB
  jackson:
    deserialization:
      fail-on-unknown-properties: false
    date-format: yyyy-MM-dd HH:mm:ss
  # task:
    # 启用虚拟线程后无需再配置线程池
    # execution:
    #   pool:
    #     core-size: 8
    #     max-size: 32
    #     queue-capacity: 1024
  data:
    redis:
      database: 0
      host: 127.0.0.0
      port: 6379
      password: 123456
      connect-timeout: 5s
      lettuce:
        pool:
          # 虚拟线程可大幅提升连接数
          max-active: 50
          max-idle: 20
          min-idle: 10
          # max-active: 32
          # max-idle: 12
          # min-idle: 4
          max-wait: 5s
      repositories:
        enabled: false
  cache:
    type: redis
    redis:
      time-to-live: 30m
      key-prefix: "cache::"
  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://127.0.0.1:5432/seed_db?currentSchema=public&connectTimeout=5&socketTimeout=60&tcpKeepAlive=true&stringtype=unspecified
    username: seed
    password: 123456
    lazy: true
    hikari:
      # 启用虚拟线程可以大幅提升连接数
      maximum-pool-size: 50
      minimum-idle: 10
      # maximum-pool-size: 20
      # minimum-idle: 4
      keepalive-time: 300000
      idle-timeout: 1800000
      max-lifetime: 7200000
      connection-timeout: 5000
      validation-timeout: 3000
management:
  endpoint:
    health:
      show-details: when_authorized
      probes:
        enabled: true
  endpoints:
    web:
      exposure:
        include: "*"
mybatis-flex:
  global-config:
    print-banner: false
    key-config:
      key-type: generator
      value: snowFlakeId
    logic-delete-column: deleted
    normal-value-of-logic-delete: 0
    deleted-value-of-logic-delete: 1
logging:
  level:
    root: info
    web: debug
    io.github.seed: trace
app:
  security:
    access-token-ttl: 30m
    refresh-token-ttl: 24h
    auto-renew: false
    enable-refresh-token: true
    permit-urls:
      - /favicon.ico
      - /swagger-ui/**
      - /swagger-ui.html
      - /v3/api-docs/**
      - /actuator/**
      - /error
    actuator:
      enabled: true
      username: actuator
      password: Seed@2026
      roles: ACTUATOR
      permit-urls: health,info
  file-storage:
    root-path: upload/
    expire-duration: 0
    download:
      http-cacheable: true
      http-cache-max-age: 604800
      urlTemplate: /file/download/{fileId}/{fileName}
    local:
      upload-dir: tmp/
  captcha:
    # 图片验证码
    image-expire: 5m
    image-width: 200
    image-height: 50
    # 宽高会按下面的范围做夹取，防止构造超大图片
    image-min-width: 80
    image-max-width: 400
    image-min-height: 30
    image-max-height: 200
    image-code-length: 4
    image-line-count: 30
    # 短信验证码
    sms-expire: 5m
    # 相同场景下同一手机号的发送间隔，不同场景互不影响
    sms-send-interval: 60s
    sms-code-length: 6
    sms-max-per-mobile-per-day: 20
    # 短信场景白名单，防止前端轮换场景绕过发送频率限制，为空则不限制
    sms-scenes:
      - login
      - register
      - reset_password
      - bind_mobile
      - change_mobile
    # 验证码在短信模板参数中的占位名，配合 app.sms.templates 中配置的场景模板使用
    sms-code-param: code
    # 未配置短信模板时发送的文本短信内容，{}依次为验证码、有效分钟数
    sms-content-template: "您的验证码是{}，{}分钟内有效，请勿泄露给他人。"
  sms:
    # 短信签名，需与服务商报备的名称一致
    sign-name:
    # 业务场景 -> 短信模板编码：命中场景用对应模板，未命中用default，都没有则退化为发送文本内容
    # 国内服务商基本都要求模板先报备，接入后把下面的示例换成真实模板编码即可
    # templates:
    #   default: SMS_100000001
    #   login: SMS_100000002
    #   reset_password: SMS_100000003
    # 短信发送为「新增落库排队 -> 调度发送」两段式
    # 派发由定时任务表里的 smsDispatchJob 驱动（cron 见该任务），启停、频率都在任务管理页改，不再用配置项开关
    # 每轮最多派发的短信条数
    send-batch-size: 100
    # 发送失败后允许的最大重试次数（总发送次数 = 1 + 该值）：失败次数未超过该值时状态退回待发送，超过则置为发送失败终态
    max-retry: 3
    # 发送中状态的超时时间（毫秒）：节点发送过程中异常中断时记录会停留在发送中，超过该时间可被其他节点重新领取
    sending-timeout: 300000
  job:
    # 本节点是否参与任务调度：false 时本节点不挑任务也不发心跳，纯跑业务
    enabled: true
    # 挑任务的轮询间隔，上一轮结束后间隔该时间再发起下一轮
    poll-interval: 3s
    # 每轮最多挑多少个任务，防止一次拉太多把本节点压满
    fetch-size: 20
    # 节点心跳间隔
    heartbeat-interval: 15s
    # 心跳超过该时间没续期就视为节点已下线，它没跑完的任务由存活节点接管；应大于心跳间隔的2~3倍
    node-timeout: 45s
    # 任务被抢占后超过该时间仍未回写视为卡死，触发回收；要大于单个任务的最长可能耗时
    fire-timeout: 30m
