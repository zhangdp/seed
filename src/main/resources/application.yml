server:
  port: 8080
  shutdown: graceful
  tomcat:
    max-connections: 20000
spring:
  profiles:
    active: dev
  application:
    name: @artifactId@
  threads:
    virtual:
      enabled: true
  servlet:
    multipart:
      enabled: true
      max-file-size: 256MB
      max-request-size: 256MB
  jackson:
    deserialization:
      fail-on-unknown-properties: false
    date-format: yyyy-MM-dd HH:mm:ss
  # task:
    # 启用虚拟线程后无需再配置线程池
    # execution:
    #   pool:
    #     core-size: 8
    #     max-size: 32
    #     queue-capacity: 1024
  data:
    redis:
      database: 0
      host: 127.0.0.0
      port: 6379
      password: 123456
      connect-timeout: 5s
      lettuce:
        pool:
          # 虚拟线程可大幅提升连接数
          max-active: 50
          max-idle: 20
          min-idle: 10
          # max-active: 32
          # max-idle: 12
          # min-idle: 4
          max-wait: 5s
      repositories:
        enabled: false
  cache:
    type: redis
    redis:
      time-to-live: 30m
      key-prefix: "cache::"
  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://127.0.0.1:5432/seed_db?currentSchema=public&connectTimeout=5&socketTimeout=60&tcpKeepAlive=true&stringtype=unspecified
    username: seed
    password: 123456
    lazy: true
    hikari:
      # 启用虚拟线程可以大幅提升连接数
      maximum-pool-size: 50
      minimum-idle: 10
      # maximum-pool-size: 20
      # minimum-idle: 4
      keepalive-time: 300000
      idle-timeout: 1800000
      max-lifetime: 7200000
      connection-timeout: 5000
      validation-timeout: 3000
management:
  endpoint:
    health:
      show-details: when_authorized
      probes:
        enabled: true
  endpoints:
    web:
      exposure:
        include: "*"
mybatis-flex:
  global-config:
    print-banner: false
    key-config:
      key-type: generator
      value: snowFlakeId
    logic-delete-column: deleted
    normal-value-of-logic-delete: 0
    deleted-value-of-logic-delete: 1
logging:
  level:
    root: info
    web: debug
    io.github.seed: trace
app:
  security:
    access-token-ttl: 30m
    refresh-token-ttl: 24h
    auto-renew: false
    enable-refresh-token: true
    permit-urls:
      - /favicon.ico
      - /swagger-ui/**
      - /swagger-ui.html
      - /v3/api-docs/**
      - /actuator/**
      - /error
    actuator:
      enabled: true
      username: actuator
      password: Seed@2026
      roles: ACTUATOR
      permit-urls: health,info
    # 缓存定时全量刷新，兜住变更通知丢失（pub/sub不持久化），默认关闭
    jti-blacklist-refresh:
      enabled: false
      interval: 5m
    role-permission-refresh:
      enabled: false
      interval: 30m
  file-storage:
    root-path: upload/
    expire-duration: 0
    download:
      http-cacheable: true
      http-cache-max-age: 604800
      urlTemplate: /file/download/{fileId}/{fileName}
    local:
      upload-dir: tmp/
  captcha:
    # 行为验证码（tianai-captcha）：滑块/旋转/拼接/文字点选，背景图在 classpath:captcha/behavior/bg/
    behavior:
      # 获取到完成行为校验的窗口
      expire: 5m
      # 校验通过后签发的一次性票据有效期，票据提交给登录等业务接口
      ticket-expire: 2m
      # 启用的类型：SLIDER滑块、ROTATE旋转、CONCAT拼接、WORD_IMAGE_CLICK文字点选
      # 获取时不指定type则从中随机；想关掉某种交互直接从这里移除
      types:
        - SLIDER
        - ROTATE
        - CONCAT
        - WORD_IMAGE_CLICK
    # 图片验证码（字符型），已废弃保留仅为兼容旧前端，新接入一律用 behavior
    image:
      expire: 5m
      width: 200
      height: 50
      min-width: 80
      max-width: 400
      min-height: 30
      max-height: 200
      code-length: 4
      line-count: 30
    # 短信验证码；发送间隔等发送侧规则在 app.sms
    sms:
      expire: 5m
      code-length: 6
      # 场景白名单，防止前端轮换场景绕过发送频率限制，为空则不限制
      scenes:
        - login
        - register
        - reset_password
        - bind_mobile
        - change_mobile
      # 验证码在短信模板参数中的占位名，配合 app.sms.templates 中配置的场景模板使用
      code-param: code
      # 未配置短信模板时发送的文本短信内容，{}依次为验证码、有效分钟数
      content-template: "您的验证码是{}，{}分钟内有效，请勿泄露给他人。"
  sms:
    send-interval: 60s
    sign-name:
    send-batch-size: 100
    max-retry: 3
    sending-timeout: 300000
  job:
    enabled: true
    poll-interval: 3s
    fetch-size: 20
    heartbeat-interval: 10s
    node-timeout: 30s
    fire-timeout: 30m
